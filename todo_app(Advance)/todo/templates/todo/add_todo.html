<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>افزودن کار جدید</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; margin: 20px; direction: rtl; text-align: right;}
        .form-container { background-color: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto;}
        h2 { color: #007bff; margin-bottom: 20px;}
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* اطمینان از درست محاسبه عرض */
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1em;
        }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
<div class="form-container">
    <h2>➕ افزودن کار جدید</h2>
    <!-- فرم ارسال داده‌ها به مسیر /add/ با متد POST -->
    <form method="POST" action="{% url 'add_todo' %}">
        {% csrf_token %}  <!-- حتماً برای امنیت اضافه شود -->

        <label for="title">عنوان کار:</label>
        <input type="text" id="title" name="title" required>

        <label for="description">توضیحات (اختیاری):</label>
        <textarea id="description" name="description" rows="4"></textarea>

        <label for="status">وضعیت کار:</label>
        <select id="status" name="status" required>
            <option value="Pending">در انتظار (Pending)</option>
            <option value="InProgress">در حال انجام (InProgress)</option>
            <option value="Done">انجام شد (Done)</option>
        </select>

        <button type="submit">ثبت کار</button>
    </form>
    <p style="margin-top: 20px;"><a href="{% url 'todo_list' %}">⬅️ بازگشت به لیست</a></p>
</div>
</body>
</html>
